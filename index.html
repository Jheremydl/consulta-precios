<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de precios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- Vista de escaneo -->
    <section id="view-scan">
      <div id="reader" class="reader"></div>
      <p id="scan-msg" class="msg">Apunta la cámara al código de barras</p>
    </section>

    <!-- Resultado del escaneo -->
    <section id="view-result" class="result" hidden aria-live="polite">
      <p id="result-name" class="result__name"></p>
      <p id="result-price" class="result__price"></p>
      <p id="result-code" class="result__code"></p>
    </section>

    <!-- Formulario para guardar -->
    <section id="view-save" class="save" hidden>
      <h2>Guardar producto</h2>
      <form id="save-form">
        <input id="save-code" type="text" inputmode="numeric" placeholder="Código de barras" required>
        <input id="save-name" type="text" placeholder="Nombre del producto" required>
        <input id="save-price" type="number" step="0.01" min="0" placeholder="Precio (Q)" required>
        <button type="submit" class="btn">Guardar producto</button>
      </form>
    </section>

    <div class="actions">
      <button id="btn-again" type="button" class="btn" hidden>Escanear otro</button>
      <button id="btn-add" type="button" class="btn btn--ghost">Agregar producto</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
